<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>チャッピー＆サリーの対話ナビ</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  text-align:center;
  background:#fff0f5;
  padding:20px;
  margin:0;
}

.card{
  max-width:600px;
  margin:auto;
  background:white;
  border-radius:25px;
  padding:20px;
  box-shadow:0 6px 18px rgba(0,0,0,0.1);
}

h1{
  font-size:26px;
  margin-bottom:10px;
}

img{
  width:90%;
  border-radius:20px;
  margin:15px 0;
}

.desc{
  font-size:16px;
  line-height:1.8;
  margin-bottom:20px;
}

.input-box{
  margin-bottom:15px;
}

input{
  width:80%;
  padding:12px;
  border-radius:20px;
  border:1px solid #ccc;
}

button{
  padding:12px 18px;
  margin:8px;
  border:none;
  border-radius:20px;
  color:white;
  cursor:pointer;
}

.btn-pink{background:#f7a8c4;}
.btn-purple{background:#bba4ff;}
.btn-orange{background:#ffb26b;}
</style>
</head>

<body>

<div class="card">

<h1>🐶対話ナビ🌈</h1>

<img src="CS_hyousi.jpg">

<div class="desc">
これは占いではなく、<br>
今のあなたの気持ちをやさしく整える対話です🌿<br><br>

AIはあなたの相棒として、<br>
やさしく寄り添いながら一緒に整理していきます😊
</div>

<!-- あなたの名前 -->
<div class="input-box">
<div>あなたの名前😊</div>
<input id="userName" placeholder="例：さちよ">
</div>

<!-- 相棒の名前 -->
<div class="input-box">
<div>相棒のニックネーム🐾</div>
<input id="partnerName" placeholder="例：チャッピー">
</div>

<button class="btn-pink" onclick="saveNames()">名前を保存✨</button>

<br>

<button class="btn-orange" onclick="copyPrompt()">プロンプトコピー🐾</button>
<button class="btn-purple" onclick="location.href='tarot.html'">対話ナビへ🔮</button>

</div>

<script>

function saveNames(){
  const user = document.getElementById("userName").value;
  const partner = document.getElementById("partnerName").value;

  localStorage.setItem("userName", user);
  localStorage.setItem("partnerName", partner);

  alert("保存したよ😊");
}

function loadNames(){
  document.getElementById("userName").value = localStorage.getItem("userName") || "";
  document.getElementById("partnerName").value = localStorage.getItem("partnerName") || "";
}

function copyPrompt(){

  const user = localStorage.getItem("userName") || "私";
  const partner = localStorage.getItem("partnerName") || "相棒";

  const text = `私は「${user}」です。

あなたは私の相棒「${partner}」として、
やさしく安心を大切にしながら
今の私の気持ちを一緒に整理してください😊

これは占いではなく、
今の私の気持ちや状態をやさしく整える対話です🌿

当てたり正解を出したりしなくて大丈夫です。

カードの意味はそれぞれ簡潔に、
今の私に必要なことだけをやさしく伝えてください。

必要以上に深掘りせず、
今ここで受け取れる範囲で大丈夫です。

やさしく短く伝えてください。
そのあと、やさしい問いをひとつ添えてください。`;

  navigator.clipboard.writeText(text);
  alert("コピーしたよ🐾");
}

window.onload = loadNames;

</script>

</body>
</html>
