<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>私に戻る対話ナビ🌈</title>

<style>

body{
  font-family:"Hiragino Kaku Gothic ProN";
  text-align:center;
  background:#fff0f5;
  padding:30px;
}

/* カード風ボックス */
.container{
  background:white;
  border-radius:25px;
  padding:25px;
  max-width:420px;
  margin:auto;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* 画像 */
.main-img{
  width:100%;
  border-radius:20px;
  margin-bottom:20px;
}

/* タイトル */
h1{
  color:#5b3a1e;
  font-size:22px;
  margin-bottom:15px;
}

/* 説明文 */
.desc{
  color:#6b4b2a;
  font-size:15px;
  line-height:1.8;
  margin-bottom:20px;
}

/* ボタン */
button{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  color:white;
}

/* コピー */
.copy-btn{
  background:linear-gradient(135deg,#f7c1cc,#e6a4b4);
}

/* スタート */
.start-btn{
  background:linear-gradient(135deg,#89a8ff,#c9b6ff);
}

</style>
</head>

<body>

<div class="container">

<img src="cards/CS_hyousi.jpg" class="main-img">

<h1>私に戻る対話ナビ🌈</h1>

<div class="desc">
これは占いではなく、<br>
今のあなたの気持ちや状態をやさしく整えるための対話です🌿<br><br>

① プロンプトをコピーしてAIへ送る<br>
② タロットカードを引く<br>
③ やさしく対話する<br>
</div>

<button class="copy-btn" onclick="copyPrompt()">
✨プロンプトをコピー🐾
</button>

<button class="start-btn" onclick="goToTarot()">
🔮タロットを引く
</button>

</div>

<script>

// 🌿最初のプロンプト
function copyPrompt(){

const text = `これからカードを引いて対話します❣

これは占いではなく、
今のあなたの気持ちや状態をやさしく整理するための対話です🌿

当てたり正解を出したりしなくて大丈夫です☝️
やさしく安心を大切にしながら
今の私の気持ちを一緒に整理してください😊

カードの意味はそれぞれ簡潔に、
今の私に必要なことだけをやさしく伝えてください。

必要以上に深掘りせず
今ここで受け取れる範囲で大丈夫です。

まずはやさしく短く伝えてください。
そのあと、やさしい質問をひとつください。

私が「もう十分」と感じたら
ありがとうで終わります。`;

navigator.clipboard.writeText(text);
alert("コピーしたよ🐾✨");
}

// 🔮タロット画面へ（あとでURL変更OK）
function goToTarot(){
  window.location.href = "tarot.html";
}

</script>

</body>
</html>
