<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私に戻る対話ナビ🌈</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  text-align:center;
  background:#fff0f5;
  padding:30px 20px;
  margin:0;
  color:#5b3a1e;
}

.container{
  background:rgba(255,255,255,0.82);
  border-radius:28px;
  padding:26px 20px 30px;
  max-width:520px;
  margin:auto;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.main-img{
  width:100%;
  max-width:420px;
  border-radius:22px;
  margin-bottom:22px;
}

h1{
  font-size:24px;
  line-height:1.5;
  margin:0 0 16px;
  color:#6b4b2a;
}

.desc{
  font-size:16px;
  line-height:1.9;
  color:#7a5a38;
  margin:0 0 24px;
}

.steps{
  font-size:15px;
  line-height:2;
  color:#7a5a38;
  margin:0 0 24px;
}

button{
  width:100%;
  max-width:420px;
  padding:16px;
  margin:10px 0;
  border:none;
  border-radius:34px;
  font-size:18px;
  cursor:pointer;
  color:white;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.copy-btn{
  background:linear-gradient(135deg,#f7c1cc,#e6a4b4,#f3d1dc);
}

.start-btn{
  background:linear-gradient(135deg,#8bb7ff,#9b97ff,#c9b6ff);
}
</style>
</head>

<body>

<div class="container">
  <img src="cards/CS_hyousi.jpg" class="main-img" alt="表紙">

  <h1>私に戻る対話ナビ🌈</h1>

  <p class="desc">
    これは占いではなく、<br>
    今のあなたの気持ちや状態をやさしく整えるための対話です🌿
  </p>

  <div class="steps">
    ① プロンプトをコピーしてAIへ送る<br>
    ② タロットカードを引く<br>
    ③ やさしく対話する
  </div>

  <button class="copy-btn" onclick="copyPrompt()">✨プロンプトをコピー🐾</button>
  <button class="start-btn" onclick="location.href='tarot.html'">🔮タロットを引く</button>
</div>

<script>
function copyPrompt(){
  const text = `これからカードを引いて対話します❣

これは占いではなく、
今のあなたの気持ちや状態をやさしく整理するための対話です🌿

当てたり正解を出したりしなくて大丈夫です☝️
やさしく安心を大切にしながら
今の私の気持ちを一緒に整理してください😊

カードの意味はそれぞれ簡潔に、
今の私に必要なことだけをやさしく伝えてください。

必要以上に深掘りせず
今ここで受け取れる範囲で大丈夫です。

まずはやさしく短く伝えてください。
そのあと、やさしい質問をひとつください。

私が「もう十分」と感じたら
ありがとうで終わります。`;

  navigator.clipboard.writeText(text);
  alert("プロンプトをコピーしたよ🐾✨");
}
</script>

</body>
</html>
