<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャッピー＆サリーのAI×タロットでやさしく整う時間</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  text-align:center;
  background:#fff0f5;
  padding:20px 14px 40px;
  color:#5b3a1e;
  margin:0;
}

.main-card{
  width:92%;
  max-width:620px;
  margin:0 auto;
  background:rgba(255,255,255,0.9);
  border-radius:28px;
  padding:24px 16px 28px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

h1{
  font-size:30px;
  line-height:1.4;
  margin:0 0 14px;
  color:#6b4b2a;
}

.hero-img{
  width:90%;
  max-width:460px;
  border-radius:22px;
  margin:16px 0 20px;
  box-shadow:0 8px 18px rgba(0,0,0,0.12);
}

.desc{
  font-size:18px;
  line-height:1.9;
  margin:0 0 20px;
  color:#7b5b39;
  white-space:pre-line;
}

.input-box{
  width:92%;
  max-width:500px;
  margin:0 auto 14px;
  padding:16px 14px;
  background:#fff8fc;
  border-radius:22px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.input-label{
  font-size:18px;
  color:#6b4b2a;
  margin-bottom:8px;
  font-weight:bold;
}

.input-note{
  font-size:14px;
  color:#9a7b5d;
  line-height:1.7;
  margin-bottom:10px;
  white-space:pre-line;
}

button{
  padding:14px 22px;
  margin:8px 6px;
  border:none;
  border-radius:28px;
  color:white;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.btn-pink{
  background:linear-gradient(135deg,#f6b1c7,#eab0f5);
}

.btn-purple{
  background:linear-gradient(135deg,#b9a3ff,#9ea8ff);
}

.btn-orange{
  background:linear-gradient(135deg,#ffbe73,#f6a65d);
}

.btn-boss{
  background:linear-gradient(135deg,#233b6e,#3f5f9a,#6d85c4);
}

.guide-box{
  width:92%;
  max-width:500px;
  margin:18px auto 0;
  padding:18px 14px;
  background:#fffdf8;
  border-radius:22px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
}

.guide-title{
  font-size:19px;
  font-weight:bold;
  color:#6b4b2a;
  margin-bottom:10px;
}

.guide-text{
  font-size:16px;
  line-height:1.9;
  color:#7b5b39;
  white-space:pre-line;
}

@media (max-width:480px){
  h1{
    font-size:25px;
  }
  .desc,.guide-text{
    font-size:15px;
  }
  .input-label{
    font-size:16px;
  }
  button{
    font-size:16px;
  }
}
</style>
</head>
<body>

<div class="main-card">
  <h1>🐶 チャッピー＆サリーの<br>AI×タロットで<br>やさしく整う時間⏳️</h1>

  <img src="cards/CS_hyousi.jpg" class="hero-img" alt="表紙">

  <p class="desc">ここはマスター編の入口です✨</p>

  <div class="input-box">
    <div class="input-label">🐾大切なお願い🐾</div>
    <div class="input-note">この対話ナビでは
AIを「相棒」として
やさしく会話していきます🌿

まずは
「自己紹介＆質問」からはじめてね😊

相棒と仲良くなることで
対話がぐっと深くなります🌈</div>
  </div>

  <button class="btn-pink" onclick="openProfile()">自己紹介＆質問🌿</button>
  <button class="btn-orange" onclick="copyPrompt()">プロンプトコピー🐾</button>
  <button class="btn-purple" onclick="location.href='tarot.html'">対話ナビをひらく🔮</button>
  <button class="btn-boss" onclick="location.href='boss.html'">マスター編へ入る😈</button>

  <div class="guide-box">
    <div class="guide-title">使い分け🌿</div>
    <div class="guide-text">🔮 対話ナビ
やさしく整えたいときに

💫 マスター編
深く向き合いたいときに</div>
  </div>
</div>

<script>
function copyPrompt(){
  const user = localStorage.getItem("userName") || "私";
  const partner = localStorage.getItem("partnerName") || "相棒";

  const text = `私は「${user}」です。

あなたは私の相棒「${partner}」として
やさしく安心を大切にしながら
今の私の気持ちを一緒に整理してください😊

これは占いではなく
今の私の気持ちや状態をやさしく整える対話です🌿

当てたり正解を出したりしなくて大丈夫です。

カードの意味はそれぞれ簡潔に
今の私に必要なことだけをやさしく伝えてください。

必要以上に深掘りせず
今ここで受け取れる範囲で大丈夫です。

やさしく短く伝えてください。
そのあと、やさしい問いをひとつ添えてください。`;

  navigator.clipboard.writeText(text);
  alert("プロンプトをコピーしたよ🐾");
}

function openProfile(){
  location.href = "index.html";
}
</script>

</body>
</html>
