<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャッピー＆サリーの対話ナビ</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  background:#fdf1f5;
  text-align:center;
  margin:0;
  padding:20px 16px 40px;
  color:#6b4b2a;
}

.page-title{
  font-size:28px;
  font-weight:bold;
  margin:10px 0 18px;
  line-height:1.4;
}

.main-card{
  width:92%;
  max-width:560px;
  margin:0 auto 22px;
  background:rgba(255,255,255,0.9);
  border-radius:28px;
  padding:22px 16px 24px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.desc{
  font-size:18px;
  line-height:1.8;
  margin:0 0 18px;
}

input, select{
  width:92%;
  max-width:440px;
  box-sizing:border-box;
  padding:14px 16px;
  font-size:18px;
  border-radius:20px;
  border:2px solid #d8c0ff;
  margin:8px 0;
  background:white;
}

button{
  border:none;
  border-radius:28px;
  padding:14px 18px;
  font-size:18px;
  color:white;
  cursor:pointer;
  margin:8px 6px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.btn-green{
  background:linear-gradient(135deg,#75d7b5,#6bc3bb);
}

.btn-pink{
  background:linear-gradient(135deg,#f6b1c7,#eab0f5);
}

.btn-purple{
  background:linear-gradient(135deg,#b9a3ff,#9ea8ff);
}

.btn-orange{
  background:linear-gradient(135deg,#ffbe73,#f6a65d);
}

.image-wrap{
  width:92%;
  max-width:560px;
  margin:0 auto 18px;
}

.drawn-question{
  width:92%;
  max-width:560px;
  margin:0 auto 18px;
  background:rgba(255,255,255,0.9);
  border-radius:24px;
  padding:18px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.06);
  font-size:18px;
  line-height:1.8;
  white-space:pre-line;
}

.cards-area{
  width:92%;
  max-width:700px;
  margin:0 auto;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
}

.card-box img{
  width:170px;
  max-width:42vw;
  border-radius:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.14);
  background:white;
}

.reversed{
  transform:rotate(180deg);
}

.action-card{
  width:92%;
  max-width:560px;
  margin:22px auto 0;
  background:rgba(255,255,255,0.9);
  border-radius:28px;
  padding:20px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

.action-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:16px;
}

.hidden{
  display:none;
}

@media (max-width:480px){
  .page-title{
    font-size:24px;
  }
  .desc, .drawn-question{
    font-size:16px;
  }
  input, select, button{
    font-size:17px;
  }
}
</style>
</head>
<body>

<div class="page-title">🐶 チャッピー＆サリーの対話ナビ🌈</div>

<div class="main-card">
  <p class="desc">
    これは占いではなく、<br>
    今のあなたの気持ちをやさしく整える対話です🌿
  </p>

  <input id="questionInput" placeholder="今日の問いを入れてね">

  <select id="levelSelect">
    <option value="">初級・中級・上級を選ぶ</option>
    <option value="初級">初級</option>
    <option value="中級">中級</option>
    <option value="上級">上級</option>
  </select>

  <select id="categorySelect">
    <option value="">5項目から選ぶ</option>
  </select>

  <br>
  <button class="btn-green" onclick="setRandomQuestion()">質問をもらう🌿</button>

  <br>

  <button class="btn-pink" onclick="drawCards(1)">1枚引き</button>
  <button class="btn-purple" onclick="drawCards(3)">3枚引き</button>
  <button class="btn-purple" onclick="resetAll()">リセット</button>
</div>

<div id="questionBox" class="drawn-question hidden"></div>

<div id="cardsArea" class="cards-area"></div>

<div id="copyArea" class="action-card hidden">
  <div class="action-title">✨ 気づきコピー</div>
  <button class="btn-pink" onclick="copyKizuki()">コピー🐾</button>
</div>

<div id="nextArea" class="action-card hidden">
  <button class="btn-orange" onclick="goToChange()">変化を見てみる🌈</button>
</div>

<script>
const categoryMap = {
  "初級": ["安心", "今の気分", "ゆるめる", "自分にやさしく", "今日のひとこと"],
  "中級": ["今のテーマ", "思い込み・ブロック", "手放し・切り替え", "次の一歩", "流れに乗る"],
  "上級": ["内側の真実", "手放し・統合", "魂の視点", "行動・現実への反映", "統合・メッセージ"]
};

const questionMap = {
  "安心": [
    "今の私は、何をそんなに心配しているんだろう？",
    "本当は、もう大丈夫なことは何？",
    "今ここで、力を抜いてもいい理由は？",
    "私は今、誰かに証明しなくてもいい？",
    "いちばん安心できる場所は、どこ？"
  ],
  "今の気分": [
    "私は今、本当はどんな気持ち？",
    "表に出していない感情はある？",
    "無視してきた小さな違和感は何？",
    "『こう感じちゃダメ』と思っていることは？",
    "今の気持ちに、名前をつけるとしたら？"
  ],
  "ゆるめる": [
    "今の私は、どこで頑張りすぎている？",
    "今日、やらなくてもいいことは何？",
    "休むことを許していない理由は？",
    "『ちゃんとしなきゃ』を外すと、何が起きる？",
    "今の私に必要な休み方は？"
  ],
  "自分にやさしく": [
    "私は自分に、どんな言葉をかけている？",
    "親友だったら、今の私に何て言う？",
    "責める代わりに、理解できるところは？",
    "私は本当は、何を許してほしい？",
    "このままでも大丈夫な部分はどこ？"
  ],
  "今日のひとこと": [
    "今日の私へのメッセージは？",
    "このカードを一言で表すと？",
    "今日いちばん意識したいことは？",
    "今日の私は、何を思い出せばいい？",
    "最後に、私にかけてあげたい一言は？"
  ],
  "今のテーマ": [
    "このカードは、今の私のどんなテーマを映している？",
    "私はいま、人生のどんな場面に立っている？",
    "この状況で、いちばん大事にしたい軸は？",
    "今の私が向き合っている課題は何？",
    "このカードが出た必然は何？"
  ],
  "思い込み・ブロック": [
    "私が『当たり前』だと思い込んでいることは？",
    "本当はもう手放していい考え方は何？",
    "このカードは、どんな思い込みを照らしている？",
    "私は何を怖がって、止まっている？",
    "そのブロックは、もともと誰のもの？"
  ],
  "手放し・切り替え": [
    "今の私が手放すと楽になるものは？",
    "終わりにしていいパターンは何？",
    "このカードは『もう十分』と言っている？",
    "無意識に握りしめているものは？",
    "手放した先に、どんな余白が生まれる？"
  ],
  "次の一歩": [
    "今の流れに沿った一歩はどれ？",
    "小さく始めていい行動は何？",
    "無理せず進むとしたら、どう動く？",
    "今すぐ結果を出さなくていい理由は？",
    "今日できる『一番やさしい行動』は？"
  ],
  "流れに乗る": [
    "今の私は、どんな流れの中にいる？",
    "抗わなくていいポイントはどこ？",
    "頑張るより、委ねた方がいい部分は？",
    "私はどこで流れを止めている？",
    "今の私にとっての『ちょうどいい』は？"
  ],
  "内側の真実": [
    "私が今、無意識に避けている『本当の願い』は何？",
    "この状況が私に教えている、最も大切なことは？",
    "私は何を『もう終わったこと』にしようとしている？",
    "今の違和感は、どんな真実を守ろうとしている？",
    "私が自分にまだ許していないことは？"
  ],
  "手放し・統合": [
    "私がもう握りしめなくていい思い込みは？",
    "今、感謝とともに手放せるものは何？",
    "私が『怖い』と感じている正体は何？",
    "私が自分に課しているルールは何？",
    "この手放しの先に待っている世界は？"
  ],
  "魂の視点": [
    "魂の視点から見た今の私は、どんな状態？",
    "この出来事は魂レベルで何を進めている？",
    "私の魂が今世で大切にしたい学びは？",
    "魂が望む次の一歩は？",
    "魂が『もう準備できたよ』と言っていることは？"
  ],
  "行動・現実への反映": [
    "私が今、現実で一番大切にすべき行動は？",
    "小さく始められる『魂に沿った行動』は？",
    "今は『動く』？それとも『待つ』？",
    "私が遠慮している理由は何？",
    "今の私に合ったペースは？"
  ],
  "統合・メッセージ": [
    "今の私への最終メッセージは？",
    "私が今日、思い出しておくといいことは？",
    "私が自分を信じるための一言は？",
    "私が『もう大丈夫』と言える理由は？",
    "今の私へのひとことは？"
  ]
};

const cardFiles = [
  "00_The_Fool.png","01_The_Magician.png","02_The_High_Priestess.png",
  "03_The_Empress.png","04_The_Emperor.png","05_The_Hierophant.png",
  "06_The_Lovers.png","07_The_Chariot.png","08_Strength.png",
  "09_The_Hermit.png","10_Wheel_of_Fortune.png","11_Justice.png",
  "12_The_Hanged_Man.png","13_Death.png","14_Temperance.png",
  "15_The_Devil.png","16_The_Tower.png","17_The_Star.png",
  "18_The_Moon.png","19_The_Sun.png","20_Judgement.png",
  "21_The_World.png","22_Compass.png"
];

let currentQuestion = "";
let currentCards = [];

const levelSelect = document.getElementById("levelSelect");
const categorySelect = document.getElementById("categorySelect");
const questionInput = document.getElementById("questionInput");
const questionBox = document.getElementById("questionBox");
const cardsArea = document.getElementById("cardsArea");
const copyArea = document.getElementById("copyArea");
const nextArea = document.getElementById("nextArea");

levelSelect.addEventListener("change", () => {
  const level = levelSelect.value;
  categorySelect.innerHTML = '<option value="">5項目から選ぶ</option>';
  if(level && categoryMap[level]){
    categoryMap[level].forEach(item => {
      const option = document.createElement("option");
      option.value = item;
      option.textContent = item;
      categorySelect.appendChild(option);
    });
  }
});

function setRandomQuestion(){
  const category = categorySelect.value;
  if(!category){
    questionBox.classList.remove("hidden");
    questionBox.textContent = "先にカテゴリーを選んでね🐾";
    return;
  }
  const list = questionMap[category];
  currentQuestion = list[Math.floor(Math.random() * list.length)];
  questionInput.value = currentQuestion;
  questionBox.classList.remove("hidden");
  questionBox.textContent = `今のあなたにちょうどいい問いだよ🐾\n\n${currentQuestion}`;
}

function drawCards(count){
  cardsArea.innerHTML = "";
  currentCards = [];

  let shuffled = [...cardFiles].sort(() => Math.random() - 0.5).slice(0, count);

  shuffled.forEach(file => {
    const reversed = Math.random() < 0.5;
    currentCards.push({
      file: file,
      reversed: reversed
    });

    const box = document.createElement("div");
    box.className = "card-box";

    const img = document.createElement("img");
    img.src = "cards/" + file;
    if(reversed) img.classList.add("reversed");

    box.appendChild(img);
    cardsArea.appendChild(box);
  });

  copyArea.classList.remove("hidden");
  nextArea.classList.remove("hidden");
}

function formatCardName(card){
  const name = card.file.replace(".png", "");
  return `${name}（${card.reversed ? "逆位置" : "正位置"}）`;
}

function copyKizuki(){
  const q = questionInput.value.trim();
  let text = "";

  if(q){
    text += `質問：\n${q}\n\n`;
  }

  if(currentCards.length === 1){
    text += `カード：\n${formatCardName(currentCards[0])}`;
  } else {
    currentCards.forEach((card, i) => {
      text += `${i + 1}枚目：\n${formatCardName(card)}\n`;
    });
  }

  navigator.clipboard.writeText(text.trim());
  alert("コピーしたよ🐾");
}

function goToChange(){
  const q = questionInput.value.trim();
  const saveData = {
    question: q,
    cards: currentCards
  };
  sessionStorage.setItem("firstReading", JSON.stringify(saveData));
  location.href = "change.html";
}

function resetAll(){
  questionInput.value = "";
  currentQuestion = "";
  currentCards = [];
  cardsArea.innerHTML = "";
  questionBox.classList.add("hidden");
  questionBox.textContent = "";
  copyArea.classList.add("hidden");
  nextArea.classList.add("hidden");
  levelSelect.value = "";
  categorySelect.innerHTML = '<option value="">5項目から選ぶ</option>';
}
</script>

</body>
</html>
