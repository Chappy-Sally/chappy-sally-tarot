let currentCards = [];
let currentSelectedQuestion = "";
let currentMainLabel = "";
let currentSubLabel = "";

function getRandomItem(list){
  return list[Math.floor(Math.random() * list.length)];
}

function getRandomItemsNoRepeat(list, count){
  const shuffled = [...list].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

function formatCardName(fileName, reversed){
  return fileName.replace(".png","") + "（" + (reversed ? "逆位置" : "正位置") + "）";
}

function getQuestionText(){
  const manual = document.getElementById("question").value.trim();
  if(manual) return manual;
  return currentSelectedQuestion;
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text);
  alert("コピーしたよ✨\n\n" + text);
}

function updateSubCategory(){
  const level = document.getElementById("level-category").value;
  const sub = document.getElementById("sub-category");
  sub.innerHTML = '<option value="">5項目から選ぶ</option>';

  if(!level || !questionGroups[level]) return;

  const groups = questionGroups[level];
  Object.keys(groups).forEach(key => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = groups[key].label;
    sub.appendChild(option);
  });
}

function showRandomQuestion(){
  const level = document.getElementById("level-category").value;
  const subKey = document.getElementById("sub-category").value;
  const area = document.getElementById("question-result");

  if(!level){
    area.classList.remove("hidden");
    area.textContent = "まずは初級・中級・上級を選んでね🐾";
    return;
  }

  if(!subKey){
    area.classList.remove("hidden");
    area.textContent = "つぎに5項目からひとつ選んでね🌈";
    return;
  }

  const group = questionGroups[level][subKey];
  currentSelectedQuestion = getRandomItem(group.items);

  currentMainLabel =
    level === "beginner" ? "初級" :
    level === "middle" ? "中級" : "上級";

  currentSubLabel = group.label;

  area.classList.remove("hidden");
  area.textContent =
    "今のあなたにちょうどいい問いだよ🐾\n\n" +
    "【" + currentMainLabel + "｜" + currentSubLabel + "】\n" +
    currentSelectedQuestion;
}

function createCard(fileName, reversed){
  const box = document.createElement("div");
  box.className = "card-box";

  const img = document.createElement("img");
  img.src = "cards/" + fileName;
  img.alt = fileName;

  if(reversed){
    img.classList.add("reversed");
  }

  box.appendChild(img);
  return box;
}

function clearCards(){
  document.getElementById("cards").innerHTML = "";
  document.getElementById("summary-area").innerHTML = "";
}

function drawOne(){
  clearCards();

  const file = getRandomItem(cardFiles);
  const reversed = Math.random() < 0.5;
  currentCards = [{ file, reversed }];

  const area = document.getElementById("cards");
  area.appendChild(createCard(file, reversed));

  showSummaryButtons(1);
}

function drawThree(){
  clearCards();

  const selected = getRandomItemsNoRepeat(cardFiles, 3);
  currentCards = selected.map(file => ({
    file,
    reversed: Math.random() < 0.5
  }));

  const area = document.getElementById("cards");
  currentCards.forEach(card => {
    area.appendChild(createCard(card.file, card.reversed));
  });

  showSummaryButtons(3);
}

function buildSimpleCopyText(){
  const question = getQuestionText();
  let text = "";

  if(question){
    text += "質問：\n" + question + "\n\n";
  }

  if(currentCards.length === 1){
    text += "カード：\n" + formatCardName(currentCards[0].file, currentCards[0].reversed);
  } else {
    currentCards.forEach((card, index) => {
      text += (index + 1) + "枚目：\n" + formatCardName(card.file, card.reversed) + "\n";
    });
  }

  return text.trim();
}

function buildKizukiCopyText(){
  return buildSimpleCopyText();
}

function saveFirstStepData(){
  const payload = {
    question: getQuestionText(),
    cards: currentCards
  };
  sessionStorage.setItem("tarotFirstStep", JSON.stringify(payload));
}

  const title = document.createElement("div");
  title.className = "summary-title";
  title.textContent = cardCount === 1 ? "✨ 1枚の対話ナビ" : "✨ 3枚の対話ナビ";

  const buttons = document.createElement("div");
  buttons.className = "summary-buttons";

  const copyBtn = document.createElement("button");
  copyBtn.className = "mini-btn mini-copy";
  copyBtn.textContent = cardCount === 1 ? "1枚コピー🐾" : "3枚コピー🐾";
  copyBtn.onclick = () => copyToClipboard(buildSimpleCopyText());

  const kizukiBtn = document.createElement("button");
  kizukiBtn.className = "mini-btn mini-ai";
  kizukiBtn.textContent = "気づきコピー🤖";
  kizukiBtn.onclick = () => copyToClipboard(buildKizukiCopyText());

  buttons.appendChild(copyBtn);
  buttons.appendChild(kizukiBtn);

  box.appendChild(title);
  box.appendChild(buttons);
  area.appendChild(box);

  const nextBox = document.createElement("div");
  nextBox.className = "next-box";

  const msg = document.createElement("div");
  msg.className = "next-message";
  msg.textContent =
    "気がついたあなたは、\n" +
    "もう大丈夫に向かってるよ😊\n\n" +
    "そのまま少しゆるんだ状態で、\n" +
    "もう一度カードを引いてみてね🌈";

  const nextBtn = document.createElement("button");
  nextBtn.className = "mini-btn next-btn";
  nextBtn.textContent = "2回目のカードを引く🌈";
  nextBtn.onclick = () => {
    saveFirstStepData();
    location.href = "change.html";
  };

  nextBox.appendChild(msg);
  nextBox.appendChild(nextBtn);
  area.appendChild(nextBox);
}

function resetAll(){
  currentCards = [];
  currentSelectedQuestion = "";
  currentMainLabel = "";
  currentSubLabel = "";

  document.getElementById("question").value = "";
  document.getElementById("level-category").value = "";
  document.getElementById("sub-category").innerHTML = '<option value="">5項目から選ぶ</option>';
  document.getElementById("question-result").innerHTML = "";
  document.getElementById("question-result").classList.add("hidden");

  clearCards();
  sessionStorage.removeItem("tarotFirstStep");
}
</script>

</body>
</html>
