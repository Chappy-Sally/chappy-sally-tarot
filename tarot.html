<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>チャッピー＆サリーの対話ナビ</title>

<style>
body{
  font-family:sans-serif;
  background:#fff0f5;
  text-align:center;
  padding:20px;
}

.box{
  background:white;
  padding:18px;
  border-radius:20px;
  margin-bottom:15px;
}

button{
  padding:12px 16px;
  margin:6px;
  border:none;
  border-radius:20px;
  color:white;
  font-size:16px;
}

.btn-pink{background:#f7a8c4;}
.btn-purple{background:#bba4ff;}
.btn-orange{background:#ffb26b;}

select,input{
  padding:10px;
  border-radius:12px;
  border:1px solid #ccc;
  margin:6px;
  width:80%;
}

.cards{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

img{
  width:120px;
  border-radius:10px;
}

.reversed{transform:rotate(180deg);}

.notice{
  font-size:14px;
  line-height:1.7;
}
</style>
</head>

<body>

<h2>🐶対話ナビ🌈</h2>

<div class="box">

<div>今の気持ちを選んでね😊</div>

<select id="feelingSelect">
<option value="">選択してください</option>
<option>よくわからない</option>
<option>もやっとしてる</option>
<option>なんとなく不安</option>
<option>少し安心してる</option>
</select>

<div>ひとこと追加したいとき</div>
<input id="feelingInput" placeholder="自由入力OK">

</div>

<div class="box">
<div>カテゴリ選択🌿</div>

<button class="btn-pink" onclick="setCategory('S')">初級</button>
<button class="btn-purple" onclick="setCategory('C')">中級</button>
<button class="btn-orange" onclick="setCategory('J')">上級</button>

<div id="sub"></div>
<div id="question"></div>

</div>

<div class="box">
<button onclick="draw(1)">1枚引き</button>
<button onclick="draw(3)">3枚引き</button>
</div>

<div id="cards" class="cards"></div>

<div class="box">
<button class="btn-pink" onclick="copyMain()">対話スタートコピー🐾</button>
<button class="btn-orange" onclick="copyExtra()">追加カードコピー🌈</button>
</div>

<div class="box notice">
しっくりこなかったら、
気がすむまでAIと話しても大丈夫😊

答えを出さなくてもいいし、
カードを引きなおしてもOKだよ🌈
</div>

<script>

const categoryMap={
S:["安心","気分","ゆるめる","やさしさ","ひとこと"],
C:["テーマ","思い込み","手放し","行動","流れ"],
J:["真実","統合","魂","現実","最終"]
};

const questionMap={
"安心":["今の私は何を心配している？","本当はもう大丈夫なことは？"],
"気分":["私は今どんな気持ち？","本音は何？"],
"ゆるめる":["どこで頑張りすぎてる？","やめてもいいことは？"],
"やさしさ":["私は自分にどんな言葉をかける？"],
"ひとこと":["今の私への一言は？"],

"テーマ":["今のテーマは？"],
"思い込み":["手放す思い込みは？"],
"手放し":["終わらせていいことは？"],
"行動":["次の一歩は？"],
"流れ":["今の流れは？"],

"真実":["本当の願いは？"],
"統合":["統合するものは？"],
"魂":["魂の視点では？"],
"現実":["現実で何する？"],
"最終":["最終メッセージは？"]
};

let currentQ="";
let drawn=[];

function setCategory(type){
  const area=document.getElementById("sub");
  area.innerHTML="";

  categoryMap[type].forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c;
    btn.onclick=()=>setQuestion(c);
    area.appendChild(btn);
  });
}

function setQuestion(cat){
  const q=questionMap[cat];
  currentQ=q[Math.floor(Math.random()*q.length)];
  document.getElementById("question").innerText=currentQ;
}

const cards=[
"00_The_Fool.png","01_The_Magician.png","02_The_High_Priestess.png",
"03_The_Empress.png","04_The_Emperor.png","05_The_Hierophant.png",
"06_The_Lovers.png","07_The_Chariot.png","08_Strength.png",
"09_The_Hermit.png","10_Wheel_of_Fortune.png","11_Justice.png",
"12_The_Hanged_Man.png","13_Death.png","14_Temperance.png",
"15_The_Devil.png","16_The_Tower.png","17_The_Star.png",
"18_The_Moon.png","19_The_Sun.png","20_Judgement.png",
"21_The_World.png","22_Compass.png"
];

function draw(n){
  drawn=[];
  let html="";

  for(let i=0;i<n;i++){
    let c=cards[Math.floor(Math.random()*cards.length)];
    let rev=Math.random()<0.5;

    drawn.push(c.replace(".png","")+(rev?"（逆位置）":"（正位置）"));

    html+=`<img src="cards/${c}" class="${rev?'reversed':''}">`;
  }

  document.getElementById("cards").innerHTML=html;
}

function getFeeling(){
  const select=document.getElementById("feelingSelect").value;
  const input=document.getElementById("feelingInput").value;
  return input || select || "（特になし）";
}

function copyMain(){
  let text=`今の私の気持ち：
${getFeeling()}

質問：
${currentQ || "（直感）"}

カード：
${drawn.join("\n")}`;

  navigator.clipboard.writeText(text);
  alert("コピーしたよ✨");
}

function copyExtra(){
  let text=`追加カード：
${drawn.join("\n")}`;

  navigator.clipboard.writeText(text);
  alert("コピーしたよ✨");
}

</script>

</body>
</html>
