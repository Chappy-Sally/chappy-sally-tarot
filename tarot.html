<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャッピー＆サリーの対話ナビ</title>

<style>
body{
  font-family:"Hiragino Kaku Gothic ProN", sans-serif;
  background:#fff0f5;
  text-align:center;
  margin:0;
  padding:20px 14px 40px;
  color:#6b4b2a;
}

.page-title{
  font-size:28px;
  font-weight:bold;
  line-height:1.4;
  margin:8px 0 18px;
}

.box{
  width:92%;
  max-width:640px;
  margin:0 auto 18px;
  background:rgba(255,255,255,0.88);
  border-radius:28px;
  padding:22px 16px;
  box-shadow:0 6px 18px rgba(0,0,0,0.07);
}

.desc{
  font-size:18px;
  line-height:1.8;
  margin:0 0 16px;
}

.label{
  font-size:16px;
  line-height:1.7;
  color:#8a6a4a;
  margin:8px 0 6px;
}

input, textarea{
  width:92%;
  max-width:480px;
  box-sizing:border-box;
  padding:14px 16px;
  border-radius:20px;
  border:2px solid #d8c0ff;
  font-size:17px;
  background:white;
  margin:6px 0 10px;
}

textarea{
  min-height:72px;
  resize:vertical;
}

button{
  border:none;
  border-radius:28px;
  padding:14px 18px;
  font-size:18px;
  color:white;
  cursor:pointer;
  margin:8px 6px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.btn-pink{
  background:linear-gradient(135deg,#f6b1c7,#eab0f5);
}

.btn-purple{
  background:linear-gradient(135deg,#b9a3ff,#9ea8ff);
}

.btn-orange{
  background:linear-gradient(135deg,#ffbe73,#f6a65d);
}

.btn-green{
  background:linear-gradient(135deg,#75d7b5,#6bc3bb);
}

.level-row,
.sub-row,
.draw-row{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-top:8px;
}

.question-box{
  width:92%;
  max-width:560px;
  margin:14px auto 0;
  padding:16px 14px;
  background:#f6ecff;
  border-radius:20px;
  font-size:18px;
  line-height:1.8;
  white-space:pre-line;
}

.cards-area{
  width:94%;
  max-width:760px;
  margin:0 auto 14px;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:18px;
}

.card-box img{
  width:180px;
  max-width:28vw;
  min-width:120px;
  border-radius:16px;
  box-shadow:0 8px 18px rgba(0,0,0,0.14);
  background:white;
}

.reversed{
  transform:rotate(180deg);
}

.notice{
  font-size:20px;
  line-height:1.9;
  white-space:pre-line;
}

.hidden{
  display:none;
}

@media (max-width: 480px){
  .page-title{
    font-size:24px;
  }
  .desc, .question-box, .notice{
    font-size:16px;
  }
  button, input, textarea{
    font-size:16px;
  }
  .card-box img{
    width:150px;
    max-width:40vw;
    min-width:110px;
  }
}
</style>

<body>

<div class="page-title">🐶 チャッピー＆サリーの対話ナビ🌈</div>

<div class="box">
  <p class="desc">
    これは占いではなく、<br>
    今のあなたの気持ちをやさしく整える対話です🌿
  </p>

  <div class="label">今の気持ちをひとこと入れてね😊<br>（よくわからない・もやっとしてる、でもOK）</div>
  <textarea id="feelingInput" placeholder="今の私の気持ち・状態"></textarea>

  <div class="label">カテゴリを選ぶ🌿</div>
  <div class="level-row">
    <button class="btn-pink" onclick="selectLevel('S')">初級</button>
    <button class="btn-purple" onclick="selectLevel('C')">中級</button>
    <button class="btn-orange" onclick="selectLevel('J')">上級</button>
  </div>

  <div id="subCategoryArea" class="sub-row"></div>

  <div id="questionBox" class="question-box hidden"></div>
</div>

<div class="box">
  <div class="draw-row">
    <button class="btn-pink" onclick="drawCards(1)">1枚引き</button>
    <button class="btn-purple" onclick="drawCards(3)">3枚引き</button>
    <button class="btn-purple" onclick="resetAll()">リセット</button>
  </div>
</div>

<div id="cardsArea" class="cards-area"></div>

<div id="copyArea" class="box hidden">
  <div class="page-title" style="font-size:24px; margin:0 0 10px;">✨ 気づきコピー</div>
  <button class="btn-pink" onclick="copyKizuki()">コピー🐾</button>
</div>

<div id="noticeArea" class="box hidden">
  <div class="notice">しっくりこなかったら、
気がすむまでAIと話しても大丈夫😊

答えを出さなくてもいいし、
そのまま対話しながらカードを引きなおしてもOKだよ🌈</div>
</div>

const cardFiles = [

let currentLevel = "";
let currentQuestion = "";
let currentCards = [];

function selectLevel(level){
  currentLevel = level;
  currentQuestion = "";
  document.getElementById("questionBox").classList.add("hidden");
  document.getElementById("questionBox").textContent = "";

  const area = document.getElementById("subCategoryArea");
  area.innerHTML = "";

  categoryMap[level].forEach(category => {
    const btn = document.createElement("button");
    btn.textContent = category;
    btn.className = "btn-purple";
    btn.onclick = () => selectCategory(category);
    area.appendChild(btn);
  });
}

function selectCategory(category){
  const list = questionMap[category];
  currentQuestion = list[Math.floor(Math.random() * list.length)];

  const box = document.getElementById("questionBox");
  box.classList.remove("hidden");
  box.textContent = currentQuestion;
}

function drawCards(count){
  const cardsArea = document.getElementById("cardsArea");
  cardsArea.innerHTML = "";
  currentCards = [];

  const selected = [...cardFiles].sort(() => Math.random() - 0.5).slice(0, count);

  selected.forEach(file => {
    const reversed = Math.random() < 0.5;
    const card = { file, reversed };
    currentCards.push(card);

    const box = document.createElement("div");
    box.className = "card-box";

    const img = document.createElement("img");
    img.src = "cards/" + file;
    img.alt = file;
    if(reversed){
      img.classList.add("reversed");
    }

    box.appendChild(img);
    cardsArea.appendChild(box);
  });

  document.getElementById("copyArea").classList.remove("hidden");
  document.getElementById("noticeArea").classList.remove("hidden");
}

function formatCard(card){
  return `${card.file.replace(".png","")}（${card.reversed ? "逆位置" : "正位置"}）`;
}

function copyKizuki(){
  const feeling = document.getElementById("feelingInput").value.trim();

  let text = "";

  if(feeling){
    text += `今の私の気持ち：\n${feeling}\n\n`;
  }

  if(currentQuestion){
    text += `質問：\n${currentQuestion}\n\n`;
  }

  text += "カード：\n";
  currentCards.forEach(card => {
    text += `${formatCard(card)}\n`;
  });

  navigator.clipboard.writeText(text.trim());
  alert("コピーしたよ🐾");
}

function resetAll(){
  currentLevel = "";
  currentQuestion = "";
  currentCards = [];

  document.getElementById("feelingInput").value = "";
  document.getElementById("subCategoryArea").innerHTML = "";
  document.getElementById("questionBox").classList.add("hidden");
  document.getElementById("questionBox").textContent = "";
  document.getElementById("cardsArea").innerHTML = "";
  document.getElementById("copyArea").classList.add("hidden");
  document.getElementById("noticeArea").classList.add("hidden");
}
