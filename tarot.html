<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対話ナビ</title>

<style>
body{
  font-family:sans-serif;
  background:#fff0f5;
  text-align:center;
  padding:20px;
}

.container{
  max-width:420px;
  margin:auto;
}

.box{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:15px;
}

button{
  padding:12px;
  margin:5px;
  border:none;
  border-radius:20px;
  font-size:14px;
  color:white;
  cursor:pointer;
}

.btn-pink{background:#ff9bb3;}
.btn-purple{background:#b89cff;}
.btn-orange{background:#ffb347;}

.question-box{
  margin-top:10px;
  padding:10px;
  background:#f9f0ff;
  border-radius:10px;
}

.cards{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

img{
  width:100px;
  border-radius:10px;
}
.reversed{transform:rotate(180deg);}
</style>
</head>

<body>
<div class="container">

<div class="box">
<h3>カテゴリーを選ぶ🌿</h3>
<button class="btn-pink" onclick="getQuestion('S')">初級</button>
<button class="btn-purple" onclick="getQuestion('C')">中級</button>
<button class="btn-orange" onclick="getQuestion('J')">上級</button>

<div id="questionBox" class="question-box"></div>
</div>

<div class="box">
<button class="btn-pink" onclick="draw(1)">1枚引き</button>
<button class="btn-purple" onclick="draw(3)">3枚引き</button>
</div>

<div id="cards" class="cards"></div>

<div class="box">
<button class="btn-pink" onclick="copyFirst()">気づきコピー</button>
<button class="btn-orange" onclick="goNext()">変化をみる🌈</button>
</div>

</div>

<script>

// 質問サンプル（あとで増やしてOK）
const questions={
S:[
"今の私は何を心配している？",
"本当はもう大丈夫なことは？"
],
C:[
"私は何を握りしめている？",
"手放すと楽になることは？"
],
J:[
"私が無意識に避けていることは？",
"この状態が教えていることは？"
]
};

let currentQ="";
let drawn=[];

function getQuestion(type){
  const q=questions[type];
  currentQ=q[Math.floor(Math.random()*q.length)];
  document.getElementById("questionBox").innerText=currentQ;
}

const cards=[
"00_The_Fool.png","01_The_Magician.png","02_The_High_Priestess.png",
"03_The_Empress.png","04_The_Emperor.png","05_The_Hierophant.png",
"06_The_Lovers.png","07_The_Chariot.png","08_Strength.png",
"09_The_Hermit.png","10_Wheel_of_Fortune.png","11_Justice.png",
"12_The_Hanged_Man.png","13_Death.png","14_Temperance.png",
"15_The_Devil.png","16_The_Tower.png","17_The_Star.png",
"18_The_Moon.png","19_The_Sun.png","20_Judgement.png",
"21_The_World.png","22_Compass.png"
];

function draw(num){
  drawn=[];
  let html="";
  for(let i=0;i<num;i++){
    let c=cards[Math.floor(Math.random()*cards.length)];
    let rev=Math.random()<0.5;
    drawn.push(c+(rev?"（逆位置）":"（正位置）"));
    html+=`<img src="cards/${c}" class="${rev?'reversed':''}">`;
  }
  document.getElementById("cards").innerHTML=html;
}

function copyFirst(){
  let text=`これは占いではありません🌿

これからカードを引いて対話します❣

当てたり正解を出したりしなくて大丈夫です☝️
やさしく安心を大切にしながら
今の私の気持ちを一緒に整理してください😊

質問：
${currentQ}

カード：
${drawn.join("\n")}
`;
  navigator.clipboard.writeText(text);
  alert("コピーしたよ✨");
}

function goNext(){
  localStorage.setItem("q",currentQ);
  localStorage.setItem("cards",JSON.stringify(drawn));
  location.href="change.html";
}

</script>

</body>
</html>
