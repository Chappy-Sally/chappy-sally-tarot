<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>チャッピー＆サリーの対話ナビ</title>

<style>
body {
  font-family: "Hiragino Kaku Gothic ProN", sans-serif;
  background: #f4e9ec;
  text-align: center;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 20px;
  margin: 20px auto;
  max-width: 350px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

button {
  border: none;
  border-radius: 20px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 14px;
  color: white;
}

.btn1 { background: #f7a8b8; }
.btn2 { background: #b9a4f4; }
.btn3 { background: #6fc3a4; }
.btn4 { background: #f4a261; }

select, input {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin: 5px;
  width: 80%;
}

.message {
  background: #f6f1f2;
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>🐶 チャッピー＆サリーの対話ナビ 🌈</h2>

<div class="card">

<p>これは占いではなく、<br>
今のあなたの気持ちをやさしく整える対話です🌿</p>

<input id="questionInput" placeholder="今日の問いを入れてね">

<br>

<select id="level">
<option value="">初級・中級・上級を選ぶ</option>
<option value="初級">初級</option>
<option value="中級">中級</option>
<option value="上級">上級</option>
</select>

<br>

<select id="sub">
<option value="">5項目から選ぶ</option>
</select>

<br>

<button class="btn3" onclick="setQuestion()">質問をもらう🌿</button>

<br><br>

<button class="btn1" onclick="draw(1)">1枚引き</button>
<button class="btn2" onclick="draw(3)">3枚引き</button>
<button class="btn2" onclick="resetAll()">リセット</button>

</div>

<div id="result"></div>

<script>

const questions = {
  "初級": ["安心", "今の気分", "ゆるめる", "自分にやさしく", "今日のひとこと"],
  "中級": ["今のテーマ", "思い込み", "手放し", "次の一歩", "流れに乗る"],
  "上級": ["内側の真実", "統合", "魂の視点", "行動", "メッセージ"]
};

document.getElementById("level").addEventListener("change", function() {
  const sub = document.getElementById("sub");
  sub.innerHTML = '<option value="">5項目から選ぶ</option>';
  if (questions[this.value]) {
    questions[this.value].forEach(q => {
      let opt = document.createElement("option");
      opt.text = q;
      sub.add(opt);
    });
  }
});

function setQuestion(){
  const sub = document.getElementById("sub").value;
  if(sub){
    document.getElementById("questionInput").value = sub;
  }
}

function draw(num){
  let result = document.getElementById("result");
  result.innerHTML = "";

  for(let i=0;i<num;i++){
    let card = Math.floor(Math.random()*22);
    let img = document.createElement("img");
    img.src = "images/" + card + ".png";
    img.style.width = "120px";
    img.style.margin = "10px";
    result.appendChild(img);
  }

  result.innerHTML += `
  <div class="card">
  <h3>✨ 気づきコピー</h3>
  <button class="btn1">コピー🐾</button>
  </div>

  <div class="card">
  <button class="btn4" onclick="location.href='change.html'">
  変化を見てみる🌈
  </button>
  </div>

  <div class="message">
  しっくりこなかったら、<br>
  気がすむまでAIと話しても大丈夫😊<br><br>
  答えを出さなくてもいいし、<br>
  そのまま対話しながらカードを引きなおしてもOKだよ🌈
  </div>
  `;
}

function resetAll(){
  document.getElementById("result").innerHTML = "";
  document.getElementById("questionInput").value = "";
}
</script>

</body>
</html>
