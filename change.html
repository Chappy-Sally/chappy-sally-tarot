<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:sans-serif;background:#fff0f5;text-align:center;padding:20px;}
.box{background:white;padding:15px;border-radius:15px;margin-bottom:15px;}
button{padding:12px;margin:5px;border:none;border-radius:20px;color:white;}
.btn-pink{background:#ff9bb3;}
.btn-purple{background:#b89cff;}
</style>
</head>

<body>

<div class="box">
気がついたあなたは、
もう大丈夫に向かってるよ😊

そのまま少しゆるんだ状態で、
もう一度カードを引いてみてね🌈
</div>

<div class="box">
<button class="btn-pink" onclick="draw(1)">1枚引き</button>
<button class="btn-purple" onclick="draw(3)">3枚引き</button>
</div>

<div id="cards"></div>

<div class="box">
<button class="btn-pink" onclick="copySecond()">変化コピー</button>
<button class="btn-purple" onclick="location.href='tarot.html'">新しい問いを選ぶ🌿</button>
</div>

<div class="box">
しっくりこなかったら、
気がすむまでカードを引きなおして大丈夫😊

答えを出さなくてもいいよ🌈
</div>

<script>

const cards=[
"00_The_Fool.png","01_The_Magician.png","02_The_High_Priestess.png",
"03_The_Empress.png","04_The_Emperor.png","05_The_Hierophant.png",
"06_The_Lovers.png","07_The_Chariot.png","08_Strength.png",
"09_The_Hermit.png","10_Wheel_of_Fortune.png","11_Justice.png",
"12_The_Hanged_Man.png","13_Death.png","14_Temperance.png",
"15_The_Devil.png","16_The_Tower.png","17_The_Star.png",
"18_The_Moon.png","19_The_Sun.png","20_Judgement.png",
"21_The_World.png","22_Compass.png"
];

let drawn=[];

function draw(num){
  drawn=[];
  let html="";
  for(let i=0;i<num;i++){
    let c=cards[Math.floor(Math.random()*cards.length)];
    let rev=Math.random()<0.5;
    drawn.push(c+(rev?"（逆位置）":"（正位置）"));
    html+=`<img src="cards/${c}" width="100">`;
  }
  document.getElementById("cards").innerHTML=html;
}

function copySecond(){
  let q=localStorage.getItem("q");

  let text=`さきほどの対話の続きです🌈

最初の質問：
${q}

カード：
${drawn.join("\n")}

思い込みやブロックに気づいたあとの、
やさしい変化や流れを読み解いてください🌈

当てたり正解を出したりしなくて大丈夫です。
やさしく安心を大切にしながら、

変化してきた今の私の状態を、
やさしくシンプルに伝えてください。

必要以上に深掘りせず、
今ここで受け取れる範囲で大丈夫です。

可能であれば、
やさしい問いをひとつ添えてください。`;

  navigator.clipboard.writeText(text);
  alert("コピーしたよ✨");
}

</script>

</body>
</html>
